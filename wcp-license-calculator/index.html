<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCP License Calculator</title>
<meta name="description" content="WCP License Calculator & Market Forecast – Lizenzmodelle berechnen, vergleichen und auf Märkte hochrechnen.">
<style>
/* WCP License Calculator & Market Forecast */
:root {
  /* CI-Farben – zentral anpassbar */
  --ci-dark: #0e1418;
  --ci-dark-2: #171f25;
  --ci-dark-3: #222c33;
  --ci-accent: #d5001c;
  --ci-accent-ink: #ffffff;
  --ci-gold: #b8955a;

  --page: #f3f4f2;
  --surface: #fcfcfb;
  --surface-2: #f6f6f4;
  --border: rgba(11, 11, 11, 0.10);
  --border-strong: rgba(11, 11, 11, 0.18);
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --good: #006300;
  --good-bg: #e7f4e7;
  --warn-bg: #fff4dc;
  --bad: #b3261e;
  --bad-bg: #fde8e7;

  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #4a3aa7;
  --series-8: #e34948;

  --radius: 10px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 4px 14px rgba(0, 0, 0, .04);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --header-h: 60px;
  --sidebar-w: 248px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--text);
  background: var(--page);
}
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 22px; }
h3 { font-size: 15px; }
h4 { font-size: 13px; color: var(--text-2); font-weight: 600; }
p { margin: 0; }
a { color: var(--series-1); }

/* ---------------- Header ---------------- */
.app-header {
  position: fixed; inset: 0 0 auto 0; height: var(--header-h);
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px;
  background: var(--ci-dark);
  color: #fff;
  border-bottom: 1px solid #000;
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 8px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--ci-accent), #8a0012);
  font-weight: 800; font-size: 13px; letter-spacing: .02em;
}
.brand-title { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11px; color: #9aa6ae; text-transform: uppercase; letter-spacing: .08em; }
.header-spacer { flex: 1; }
.header-meta { display: flex; gap: 18px; align-items: center; font-size: 12px; color: #c6cfd4; }
.header-meta b { color: #fff; font-weight: 600; }
.menu-toggle { display: none; background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }

/* ---------------- Sidebar ---------------- */
.sidebar {
  position: fixed; top: var(--header-h); bottom: 0; left: 0; width: var(--sidebar-w);
  background: var(--ci-dark-2);
  color: #d9e0e4;
  padding: 16px 12px;
  overflow-y: auto;
  z-index: 15;
}
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: #7f8c94; padding: 8px 12px; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; margin: 2px 0;
  border-radius: 8px;
  color: inherit; text-decoration: none;
  font-weight: 500;
  border-left: 3px solid transparent;
}
.nav a:hover { background: var(--ci-dark-3); }
.nav a.active { background: var(--ci-dark-3); color: #fff; border-left-color: var(--ci-accent); }
.nav .num {
  width: 22px; height: 22px; border-radius: 6px;
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
  background: rgba(255,255,255,.07); color: #aab5bb;
}
.nav a.active .num { background: var(--ci-accent); color: #fff; }
.sidebar-foot { margin-top: 20px; padding: 12px; font-size: 12px; color: #8b979e; border-top: 1px solid rgba(255,255,255,.07); }

/* ---------------- Main ---------------- */
.main { margin-left: var(--sidebar-w); padding: calc(var(--header-h) + 24px) 28px 40px; min-width: 0; }
.page { display: none; max-width: 1480px; }
.page.active { display: block; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head p { color: var(--text-2); margin-top: 4px; max-width: 760px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span-2 { grid-column: span 2; }
.mt { margin-top: 16px; }
.mt-lg { margin-top: 24px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 18px;
  min-width: 0;
}
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head .sub { color: var(--muted); font-size: 12px; }
.card.flush { padding: 0; }
.card.flush .card-head { padding: 14px 18px 0; }

/* KPI Tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ci-dark-3); }
.kpi.accent::before { background: var(--ci-accent); }
.kpi .label { font-size: 12px; color: var(--text-2); }
.kpi .value { font-size: 24px; font-weight: 650; margin-top: 4px; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .value.text { font-size: 18px; white-space: normal; line-height: 1.25; }
.opt-table th, .opt-table td { padding: 6px 8px; }
.opt-table td:nth-child(5) { white-space: normal; min-width: 160px; }
.kpi .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Controls */
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); }
.field-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
input[type=number], input[type=text], select {
  font: inherit; color: var(--text);
  background: #fff;
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  padding: 7px 9px;
  min-width: 0;
  width: 100%;
}
input:focus, select:focus { outline: 2px solid var(--series-1); outline-offset: -1px; border-color: transparent; }
.input-unit { display: flex; align-items: center; gap: 6px; }
.input-unit span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); cursor: pointer; }
.check input { accent-color: var(--ci-accent); width: 15px; height: 15px; }

.btn {
  font: inherit; font-weight: 600; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border-strong); background: #fff; color: var(--text);
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ci-accent); color: var(--ci-accent-ink); border-color: var(--ci-accent); }
.btn.primary:hover { filter: brightness(.94); }
.btn.dark { background: var(--ci-dark); color: #fff; border-color: var(--ci-dark); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn.danger { color: var(--bad); }
.app-header .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.25); }
.app-header .btn:hover { background: rgba(255,255,255,.08); }

.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: #fff; }
.seg button { font: inherit; font-size: 13px; padding: 6px 14px; border: 0; background: transparent; cursor: pointer; color: var(--text-2); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--ci-dark); color: #fff; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border-strong); background: #fff; color: var(--text-2);
}
.chip.on { background: var(--ci-dark); border-color: var(--ci-dark); color: #fff; }

.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.badge.accent { background: var(--ci-accent); color: #fff; border-color: var(--ci-accent); }
.badge.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.badge.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.badge.warn { background: var(--warn-bg); color: #7a5200; border-color: transparent; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--surface-2); position: sticky; top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 650; border-top: 2px solid var(--border-strong); background: var(--surface-2); }
tr.sel td { background: #eef4fc; }
tbody tr:hover td { background: #f7f9fb; }
table.edit td { padding: 4px 4px; }
table.edit input { padding: 5px 6px; min-width: 76px; text-align: right; }
table.edit input[type=text] { text-align: left; min-width: 120px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }

/* Model cards */
.model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.model-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; cursor: pointer; box-shadow: var(--shadow); transition: border-color .15s, transform .15s;
  display: flex; flex-direction: column; gap: 8px;
}
.model-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.model-card.sel { border-color: var(--ci-accent); box-shadow: 0 0 0 1px var(--ci-accent), var(--shadow); }
.model-card.off { opacity: .55; }
.model-card .mc-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.model-card .mc-desc { font-size: 12px; color: var(--muted); min-height: 34px; }
.model-card .mc-value { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
.model-card .mc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 11px; color: var(--text-2); }
.model-card .mc-stats b { display: block; font-size: 13px; color: var(--text); font-weight: 600; }

/* Chart containers */
.chart-box { position: relative; height: 300px; }
.chart-box.tall { height: 380px; }
.chart-box.short { height: 230px; }

/* Heatmap */
.heatmap td.hm { text-align: right; font-variant-numeric: tabular-nums; min-width: 82px; border: 2px solid var(--surface); border-radius: 4px; }
.heatmap th.rot { text-align: right; }
.legend-scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend-scale .bar { height: 10px; width: 180px; border-radius: 3px; background: linear-gradient(90deg, #cde2fb, #6da7ec, #2a78d6, #1c5cab, #0d366b); }

/* Catalog */
.catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
.catalog-card .result { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--grid); display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); }
.catalog-card .result b { color: var(--text); }
.subgroup { display: grid; grid-template-columns: 22px repeat(2, minmax(0, 1fr)); gap: 8px 10px; align-items: end; padding: 8px 0; border-bottom: 1px solid var(--grid); }
.subgroup:last-of-type { border-bottom: 0; }
.subgroup .check { padding-bottom: 8px; }

/* Recommendation */
.reco {
  background: linear-gradient(135deg, var(--ci-dark), var(--ci-dark-3));
  color: #fff; border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow);
}
.reco .label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #c7d0d5; }
.reco .name { font-size: 28px; font-weight: 700; margin: 6px 0 4px; }
.reco .why { color: #d7dee2; font-size: 13px; }
.reco .score-bars { display: grid; gap: 8px; margin-top: 16px; }
.score-bar { display: grid; grid-template-columns: 120px 1fr 44px; gap: 10px; align-items: center; font-size: 12px; color: #d7dee2; }
.score-bar .track { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.score-bar .fill { height: 100%; border-radius: 4px; background: var(--ci-accent); }
.score-bar .v { text-align: right; font-variant-numeric: tabular-nums; }

.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.callout { padding: 10px 14px; border-radius: 8px; background: var(--warn-bg); color: #6a4700; font-size: 13px; margin-bottom: 12px; }
.callout.info { background: #eaf2fc; color: #1c4f8f; }

.opt-highlight { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
.opt-highlight .kpi .value { font-size: 22px; }
.delta-up { color: var(--good); }
.delta-down { color: var(--bad); }

.export-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.export-card .icon { font-size: 26px; margin-bottom: 8px; }
.export-card p { color: var(--text-2); margin: 6px 0 14px; font-size: 13px; }

.toast {
  position: fixed; right: 20px; bottom: 20px; background: var(--ci-dark); color: #fff;
  padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px;
  opacity: 0; transform: translateY(8px); transition: all .2s; pointer-events: none; z-index: 50;
}
.toast.show { opacity: 1; transform: none; }

/* ---------------- Responsive ---------------- */
@media (max-width: 1200px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .menu-toggle { display: block; }
  .sidebar { transform: translateX(-100%); transition: transform .2s; }
  body.nav-open .sidebar { transform: none; }
  .main { margin-left: 0; padding: calc(var(--header-h) + 16px) 16px 32px; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: minmax(0, 1fr); }
  .span-2 { grid-column: auto; }
  .header-meta { display: none; }
  .catalog-grid { grid-template-columns: minmax(0, 1fr); }
}

@media print {
  .app-header, .sidebar, .toolbar, .btn { display: none !important; }
  .main { margin: 0; padding: 0; }
}

table.edit select { min-width: 118px; padding: 5px 6px; }
table.edit input[type=number] { min-width: 70px; }

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<header class="app-header">
  <button class="menu-toggle" id="menuToggle" aria-label="Navigation öffnen">☰</button>
  <div class="brand">
    <div class="brand-mark">WCP</div>
    <div>
      <div class="brand-title">WCP License Calculator &amp; Market Forecast</div>
      <div class="brand-sub">Pricing &amp; Business Case</div>
    </div>
  </div>
  <div class="header-spacer"></div>
  <div class="header-meta" id="headerMeta"></div>
  <button class="btn small" id="btnReset" title="Alle Eingaben auf Standardwerte zurücksetzen">Zurücksetzen</button>
</header>

<aside class="sidebar" id="sidebar">
  <div class="nav-label">Navigation</div>
  <nav class="nav" id="nav">
    <a href="#markets" data-page="markets"><span class="num">1</span>Märkte</a>

    <a href="#catalog" data-page="catalog"><span class="num">3</span>Preiskatalog</a>

</aside>

<main class="main">
  <section class="page" id="page-markets"></section>
  <section class="page" id="page-models"></section>
  <section class="page" id="page-catalog"></section>

<script>
/* WCP License Calculator – Rechen-Engine (ohne DOM, auch in Node testbar) */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------------------
  // Modellkatalog
  // ---------------------------------------------------------------------------
  const MODELS = [
    { id: 'user', name: 'User Lizenz', group: 'Basis', simplicity: 5,
      desc: 'Preis pro aktivem User und Monat.' },
    { id: 'named', name: 'Named User', group: 'Basis', simplicity: 5,
      desc: 'Fester Benutzer (aktive + gelegentliche User), Preis pro Named User.' },
    { id: 'concurrent', name: 'Concurrent User', group: 'Basis', simplicity: 4,
      desc: 'Gleichzeitige Nutzung, Verhältnis konfigurierbar (z. B. 100 User → 40 Concurrent).' },
    { id: 'site', name: 'Standort Lizenz', group: 'Basis', simplicity: 5,
      desc: 'Preis pro Standort und Monat.' },
    { id: 'workshop', name: 'Werkstatt Lizenz', group: 'Basis', simplicity: 5,
      desc: 'Preis pro Werkstatt und Monat.' },
    { id: 'enterprise', name: 'Unternehmenslizenz', group: 'Basis', simplicity: 5,
      desc: 'Flat Fee pro Markt und Jahr.' },
    { id: 'revenue', name: 'Umsatzbasiert', group: 'Basis', simplicity: 3,
      desc: 'Prozentsatz vom Händler-/Marktumsatz.' },
    { id: 'hybrid', name: 'Hybrid', group: 'Basis', simplicity: 3,
      desc: 'Grundgebühr + Standortgebühr + Userpreis + Concurrent-Anteil, frei kombinierbar.' },
    { id: 'tier', name: 'Tier Modell', group: 'Erweitert', simplicity: 4,
      desc: 'Small / Medium / Enterprise nach User-Schwellwerten.' },
    { id: 'consumption', name: 'Consumption', group: 'Erweitert', simplicity: 2,
      desc: 'Abrechnung nach Logins, Sessions, API Calls und AI Requests.' },
    { id: 'transaction', name: 'Transaction', group: 'Erweitert', simplicity: 2,
      desc: 'Preis pro Auftrag, Werkstattauftrag, Fahrzeug und Rechnung.' },
    { id: 'freemium', name: 'Freemium → Premium', group: 'Erweitert', simplicity: 4,
      desc: 'Basisfunktionen kostenlos, Premium-Module kostenpflichtig.' },
    { id: 'modules', name: 'Modulbasiert', group: 'Erweitert', simplicity: 3,
      desc: 'Auswählbare Module (CRM, Werkstatt, Verkauf, Reporting, …).' },
    { id: 'ai', name: 'AI Add-On', group: 'Erweitert', simplicity: 3,
      desc: 'Separate Preise für AI Copilot, Agenten, Automatisierung, RAG, Dokumentenanalyse.' }
  ];
  const MODEL_BY_ID = Object.fromEntries(MODELS.map(m => [m.id, m]));

  const MARKET_FIELDS = [
    { key: 'name', label: 'Markt', type: 'text' },
    { key: 'sites', label: 'Standorte' },
    { key: 'employees', label: 'Mitarbeiter' },
    { key: 'activeUsers', label: 'Aktive User' },
    { key: 'occasionalUsers', label: 'Gelegentl. User' },
    { key: 'workshops', label: 'Werkstätten' },
    { key: 'serviceStaff', label: 'Service-MA' },
    { key: 'salesStaff', label: 'Verkäufer' },
    { key: 'growth', label: 'Wachstum % p.a.', step: 0.1 },
    { key: 'rolloutYear', label: 'Rollout-Jahr' },
    { key: 'marketRevenue', label: 'Marktumsatz Mio €', step: 1 }
  ];

  // ---------------------------------------------------------------------------
  // Standardwerte
  // ---------------------------------------------------------------------------
  function mk(name, sites, employees, activeUsers, occasionalUsers, workshops, serviceStaff, salesStaff, growth, rolloutYear, marketRevenue) {

  // ---------------------------------------------------------------------------
  // Hilfsfunktionen
  // ---------------------------------------------------------------------------
  const n = v => (Number.isFinite(+v) ? +v : 0);
  const totalUsers = m => n(m.activeUsers) + n(m.occasionalUsers);

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function getPath(obj, path) {
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
  }
  function setPath(obj, path, value) {
    const keys = path.split('.');
    const last = keys.pop();
    const target = keys.reduce((o, k) => o[k], obj);
    target[last] = value;
  }

  // Preisparameter je Modell (lineare Preis-Hebel, für Optimizer & Preisskalierung)
  function priceKeys(modelId, prices) {

      case 'user': return [{ path: 'user.pricePerUser', label: 'Preis / aktiver User / Monat', unit: '€' }];

  // ---------------------------------------------------------------------------
  // Modellberechnung für einen Markt → { total, parts: [[label, wert]] } (EUR/Jahr)
  // ---------------------------------------------------------------------------
  function tierOf(users, p) {
    if (users <= n(p.smallMax)) return 'small';
    if (users <= n(p.mediumMax)) return 'medium';
    return 'enterprise';
  }

  function calcModel(modelId, m, prices) {
    const p = prices[modelId];
    const U = totalUsers(m);
    const A = n(m.activeUsers);
    const S = n(m.sites);
    const parts = [];
    const add = (label, v) => parts.push([label, v]);

    switch (modelId) {
      case 'user':
        add('Aktive User', A * n(p.pricePerUser) * 12);
        break;
      case 'named':
        add('Named User', U * n(p.pricePerNamed) * 12);
        break;
      case 'concurrent':
        add('Concurrent User', Math.ceil(U * n(p.ratio) / 100) * n(p.pricePerConcurrent) * 12);
        break;
      case 'site':
        add('Standorte', S * n(p.pricePerSite) * 12);
        break;
      case 'workshop':
        add('Werkstätten', n(m.workshops) * n(p.pricePerWorkshop) * 12);
        break;
      case 'enterprise':
        add('Flat Fee', n(p.flatFee));
        break;
      case 'revenue':
        add('Umsatzanteil', n(m.marketRevenue) * 1e6 * n(p.percent) / 100);
        break;
      case 'hybrid': {
        const share = p.useConc ? n(p.concShare) / 100 : 0;
        if (p.useBase) add('Grundgebühr', n(p.baseFee));
        if (p.useSite) add('Standortgebühr', S * n(p.sitePrice) * 12);
        if (p.useUser) add('Userpreis', U * (1 - share) * n(p.userPrice) * 12);
        if (p.useConc) add('Concurrent', Math.ceil(U * share * n(p.concRatio) / 100) * n(p.concPrice) * 12);
        break;
      }
      case 'tier': {
        const t = tierOf(U, p);
        const key = t === 'small' ? 'small' : t === 'medium' ? 'medium' : 'ent';
        const label = t === 'small' ? 'Small' : t === 'medium' ? 'Medium' : 'Enterprise';
        add(`${label} Grundgebühr`, n(p[key + 'Base']));
        add(`${label} Userpreis`, U * n(p[key + 'User']) * 12);
        break;
      }
      case 'consumption':
        if (p.useLogins) add('Logins', U * n(p.loginsPerUser) * 12 * n(p.priceLogin));
        if (p.useSessions) add('Sessions', U * n(p.sessionsPerUser) * 12 * n(p.priceSession));
        if (p.useApi) add('API Calls', S * n(p.apiPerSite) * 12 / 1000 * n(p.priceApi1000));
        if (p.useAi) add('AI Requests', A * n(p.aiPerActiveUser) * 12 * n(p.priceAi));
        break;
      case 'transaction':
        if (p.useOrders) add('Aufträge', n(m.salesStaff) * n(p.ordersPerSales) * 12 * n(p.priceOrder));
        if (p.useWorkOrders) add('Werkstattaufträge', n(m.serviceStaff) * n(p.workOrdersPerService) * 12 * n(p.priceWorkOrder));
        if (p.useVehicles) add('Fahrzeuge', S * n(p.vehiclesPerSite) * 12 * n(p.priceVehicle));
        if (p.useInvoices) add('Rechnungen', S * n(p.invoicesPerSite) * 12 * n(p.priceInvoice));
        break;
      case 'freemium':
        add('Free Tier', 0);
        add('Premium User', U * n(p.conversion) / 100 * n(p.premiumPrice) * 12);
        break;
      case 'modules':
      case 'ai':
        p.items.forEach(it => {
          if (!it.enabled) return;
          const base = it.basis === 'site' ? S : it.basis === 'unit' ? S * n(it.units) : A;
          add(it.name, base * n(it.adoption) / 100 * n(it.price) * 12);
        });
        break;
      default:
        break;
    }
    const total = parts.reduce((s, [, v]) => s + v, 0);
    return { total, parts };
  }

  // Lizenzeinheiten (für Umsatz pro Lizenz / Übersicht)
  function licenseUnits(modelId, m, prices) {
    const p = prices[modelId];
    const U = totalUsers(m);
    switch (modelId) {
      case 'user': return { label: 'User-Lizenzen', value: n(m.activeUsers) };
      case 'named': return { label: 'Named User', value: U };
      case 'concurrent': return { label: 'Concurrent Lizenzen', value: Math.ceil(U * n(p.ratio) / 100) };
      case 'site': return { label: 'Standort-Lizenzen', value: n(m.sites) };
      case 'workshop': return { label: 'Werkstatt-Lizenzen', value: n(m.workshops) };
      case 'enterprise': return { label: 'Unternehmenslizenzen', value: 1 };
      case 'freemium': return { label: 'Premium User', value: Math.round(U * n(p.conversion) / 100) };
      default: return { label: 'User (gesamt)', value: U };
    }
  }

  // ---------------------------------------------------------------------------
  // Forecast
  // ---------------------------------------------------------------------------
  const REALISTIC = { volume: 1, growthDelta: 0, priceDelta: 0, rolloutDelay: 0, adoptionDelta: 0 };

  // Skaliert die Stammdaten eines Markts auf Forecast-Jahr t (0-basiert).
  // Gibt null zurück, wenn der Markt in diesem Jahr noch nicht ausgerollt ist.
  function marketInYear(m, t, fc, sc, idx) {
    sc = sc || REALISTIC;
    const year = n(fc.startYear) + t;
    const delay = Array.isArray(sc.marketDelay) ? n(sc.marketDelay[idx]) : n(sc.rolloutDelay);
    const rollout = n(m.rolloutYear) + delay;
    if (year < rollout) return null;
    const g = (n(m.growth) + n(sc.growthDelta)) / 100;
    const vol = n(sc.volume) || 1;
    const fBase = Math.pow(1 + g, t);
    const fUsers = fBase * Math.pow(1 + n(fc.newUsers) / 100, t) * vol;
    const fSites = Math.pow(1 + n(fc.newSites) / 100, t) * vol;
    const fStaff = fBase * vol;
    const adoption = year === rollout
      ? Math.min(100, Math.max(0, n(fc.firstYearAdoption) + n(sc.adoptionDelta))) / 100
      : 1;
    return {
      name: m.name,
      sites: n(m.sites) * fSites,
      workshops: n(m.workshops) * fSites,
      employees: n(m.employees) * fStaff,
      activeUsers: n(m.activeUsers) * fUsers,
      occasionalUsers: n(m.occasionalUsers) * fUsers,
      serviceStaff: n(m.serviceStaff) * fStaff,
      salesStaff: n(m.salesStaff) * fStaff,
      marketRevenue: n(m.marketRevenue) * fBase * vol,
      growth: m.growth,
      rolloutYear: rollout,
      adoption,
      isRolloutYear: year === rollout
    };
  }

  function priceFactor(t, fc, sc) {
    sc = sc || REALISTIC;
    return Math.pow(1 + (n(fc.priceIncrease) + n(sc.priceDelta)) / 100, t);
  }

  // Forecast eines Modells → { years, byMarket[i][t], total[t], cumulative[t], cost[t], profit[t], cumProfit[t], breakEven }
  function forecast(modelId, state, sc, horizon) {
    const fc = state.forecast;
    const H = horizon || n(fc.horizon) || 5;
    const years = [];
    const byMarket = state.markets.map(() => []);
    const total = [];
    const cost = [];
    const users = [];
    for (let t = 0; t < H; t++) {
      years.push(n(fc.startYear) + t);
      const pf = modelId === 'revenue' ? 1 : priceFactor(t, fc, sc);
      let sum = 0, c = t === 0 ? n(state.costs.platformOneTime) : 0, u = 0;
      state.markets.forEach((m, i) => {
        const mm = marketInYear(m, t, fc, sc, i);
        if (!mm) { byMarket[i].push(0); return; }
        const r = calcModel(modelId, mm, state.prices).total * pf * mm.adoption;
        byMarket[i].push(r);
        sum += r;
        const mu = totalUsers(mm) * mm.adoption;
        u += mu;
        c += (mm.isRolloutYear ? n(state.costs.rolloutPerMarket) : 0)
          + mu * n(state.costs.runPerUserYear)
          + n(state.costs.runPerMarketYear) * mm.adoption;
      });
      total.push(sum);
      cost.push(c);
      users.push(u);
    }
    const cumulative = [], profit = [], cumProfit = [];
    let cs = 0, cp = 0, breakEven = null;
    for (let t = 0; t < H; t++) {
      cs += total[t];
      cumulative.push(cs);
      profit.push(total[t] - cost[t]);
      cp += total[t] - cost[t];
      cumProfit.push(cp);
      if (breakEven === null && cp >= 0) breakEven = years[t];
    }
    return { modelId, years, byMarket, total, cumulative, cost, profit, cumProfit, breakEven, users };
  }

  // Vollausbau-Werte (aktuelle Stammdaten, alle Märkte, ohne Rollout/Ramp-up)
  function steadyState(modelId, state) {
    const perMarket = state.markets.map(m => {
      const r = calcModel(modelId, m, state.prices);
      const units = licenseUnits(modelId, m, state.prices);
      const U = totalUsers(m);
      return {
        name: m.name,
        annual: r.total,
        monthly: r.total / 12,
        perSite: n(m.sites) ? r.total / n(m.sites) : 0,
        perUser: U ? r.total / U : 0,
        parts: r.parts,
        units
      };
    });
    const annual = perMarket.reduce((s, x) => s + x.annual, 0);
    const sites = state.markets.reduce((s, m) => s + n(m.sites), 0);
    const users = state.markets.reduce((s, m) => s + totalUsers(m), 0);
    return {
      modelId,
      perMarket,
      annual,
      monthly: annual / 12,
      perSite: sites ? annual / sites : 0,
      perUser: users ? annual / users : 0
    };
  }

  // ---------------------------------------------------------------------------
  // Pricing Optimizer
  // ---------------------------------------------------------------------------
  function referenceRevenue(modelId, state, reference) {
    if (reference === 'full') return steadyState(modelId, state).annual;
    const t = Math.max(0, n(reference));
    const f = forecast(modelId, state, REALISTIC, t + 1);
    return f.total[t];
  }

  // Löst für einen einzelnen Preishebel: welcher Wert ergibt das Ziel, wenn alle anderen fix bleiben?
  function solveSingle(modelId, state, path, target, reference) {
    const s = clone(state);
    setPath(s.prices, path, 0);
    const r0 = referenceRevenue(modelId, s, reference);
    setPath(s.prices, path, 1);
    const r1 = referenceRevenue(modelId, s, reference);
    const slope = r1 - r0;
    if (slope <= 0) return { value: null, base: r0, slope };
    return { value: (target - r0) / slope, base: r0, slope };
  }

  function optimize(state, target, reference) {
    return MODELS.map(model => {
      const current = referenceRevenue(model.id, state, reference);
      const factor = current > 0 ? target / current : null;
      const keys = priceKeys(model.id, state.prices)
        .filter(k => !k.flag || getPath(state.prices, k.flag))
        .map(k => {
          const cur = n(getPath(state.prices, k.path));
          const single = solveSingle(model.id, state, k.path, target, reference);
          return {
            ...k,
            current: cur,
            scaled: factor !== null ? cur * factor : null,
            single: single.value
          };
        });
      return { model, current, factor, keys };
    });
  }

  function applyFactor(state, modelId, factor) {
    priceKeys(modelId, state.prices).forEach(k => {
      const v = n(getPath(state.prices, k.path));
      setPath(state.prices, k.path, +(v * factor).toPrecision(6));
    });
  }

  // ---------------------------------------------------------------------------
  // Monte-Carlo-Simulation
  // ---------------------------------------------------------------------------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function normal(rand) {
    let u = 0, v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function triangular(rand, a, c, b) {
    if (b <= a) return c;
    const u = rand();
    const fc = (c - a) / (b - a);
    return u < fc ? a + Math.sqrt(u * (b - a) * (c - a)) : b - Math.sqrt((1 - u) * (b - a) * (b - c));
  }
  function quantile(sorted, q) {
    if (!sorted.length) return 0;
    const pos = (sorted.length - 1) * q;
    const lo = Math.floor(pos), hi = Math.ceil(pos);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
  }

  function monteCarlo(modelId, state, opts) {
    const o = Object.assign({ runs: 3000, growthSd: 1.5, priceSd: 1, delayProb: 20, seed: 42, target: null }, opts || {});
    const rand = mulberry32(o.seed);
    const H = n(state.forecast.horizon) || 5;
    const best = state.scenarios.best, worst = state.scenarios.worst;
    const vMin = Math.min(n(worst.volume), 1), vMax = Math.max(n(best.volume), 1);
    const cum = [], lastYear = [], profit = [];
    const yearly = Array.from({ length: H }, () => []);
    for (let r = 0; r < o.runs; r++) {
      const sc = {
        volume: triangular(rand, vMin, 1, vMax),
        growthDelta: normal(rand) * n(o.growthSd),
        priceDelta: normal(rand) * n(o.priceSd),
        adoptionDelta: (rand() - 0.5) * (n(best.adoptionDelta) - n(worst.adoptionDelta)),
        marketDelay: state.markets.map(() => (rand() * 100 < n(o.delayProb) ? 1 : 0))
      };
      const f = forecast(modelId, state, sc, H);
      cum.push(f.cumulative[H - 1]);
      lastYear.push(f.total[H - 1]);
      profit.push(f.cumProfit[H - 1]);
      f.total.forEach((v, t) => yearly[t].push(v));
    }
    const sorted = cum.slice().sort((a, b) => a - b);
    const sortedLast = lastYear.slice().sort((a, b) => a - b);
    const mean = cum.reduce((s, v) => s + v, 0) / cum.length;
    const sd = Math.sqrt(cum.reduce((s, v) => s + (v - mean) * (v - mean), 0) / cum.length);
    const bands = yearly.map(arr => {
      const s = arr.sort((a, b) => a - b);
      return { p10: quantile(s, 0.1), p50: quantile(s, 0.5), p90: quantile(s, 0.9) };
    });
    const lossProb = profit.filter(v => v < 0).length / profit.length;
    const targetProb = o.target ? lastYear.filter(v => v >= o.target).length / lastYear.length : null;
    return {
      runs: o.runs, horizon: H, values: sorted, mean, sd,
      cv: mean ? sd / mean : 0,
      p5: quantile(sorted, 0.05), p10: quantile(sorted, 0.1), p50: quantile(sorted, 0.5), p90: quantile(sorted, 0.9),
      min: sorted[0], max: sorted[sorted.length - 1],
      lastP10: quantile(sortedLast, 0.1), lastP50: quantile(sortedLast, 0.5), lastP90: quantile(sortedLast, 0.9),
      valueAtRisk: mean - quantile(sorted, 0.05),
      bands, lossProb, targetProb
    };
  }

  function histogram(values, bins) {
    if (!values.length) return { edges: [], counts: [] };
    const min = values[0], max = values[values.length - 1];
    const w = (max - min) / bins || 1;
    const counts = new Array(bins).fill(0);
    values.forEach(v => { counts[Math.min(bins - 1, Math.floor((v - min) / w))]++; });
    const edges = counts.map((_, i) => min + i * w);
    return { edges, width: w, counts };
  }

  // ---------------------------------------------------------------------------
  // Sensitivität
  // ---------------------------------------------------------------------------
  const SENS_DRIVERS = [
    { id: 'users', label: 'Anzahl User', apply: (s, f) => s.markets.forEach(m => { m.activeUsers *= f; m.occasionalUsers *= f; }) },
    { id: 'sites', label: 'Standorte & Werkstätten', apply: (s, f) => s.markets.forEach(m => { m.sites *= f; m.workshops *= f; }) },
    { id: 'staff', label: 'Service-MA & Verkäufer', apply: (s, f) => s.markets.forEach(m => { m.serviceStaff *= f; m.salesStaff *= f; }) },
    { id: 'revenue', label: 'Marktumsatz', apply: (s, f) => s.markets.forEach(m => { m.marketRevenue *= f; }) },
    { id: 'price', label: 'Preisniveau', apply: (s, f, id) => applyFactor(s, id, f) },
    { id: 'growth', label: 'Wachstumsrate', apply: (s, f) => s.markets.forEach(m => { m.growth *= f; }) },
    { id: 'priceInc', label: 'Preissteigerung p.a.', apply: (s, f) => { s.forecast.priceIncrease *= f; } },
    { id: 'adoption', label: 'Adoption Rollout-Jahr', apply: (s, f) => { s.forecast.firstYearAdoption = Math.min(100, s.forecast.firstYearAdoption * f); } },
    { id: 'concRatio', label: 'Concurrent-Ratio', apply: (s, f) => { s.prices.concurrent.ratio *= f; s.prices.hybrid.concRatio *= f; } }
  ];

  function sensitivity(modelId, state, pct) {
    const d = (pct || 20) / 100;
    const base = forecast(modelId, state).cumulative.slice(-1)[0];
    const rows = SENS_DRIVERS.map(drv => {
      const lo = clone(state); drv.apply(lo, 1 - d, modelId);
      const hi = clone(state); drv.apply(hi, 1 + d, modelId);
      const vLo = forecast(modelId, lo).cumulative.slice(-1)[0];
      const vHi = forecast(modelId, hi).cumulative.slice(-1)[0];
      return {
        id: drv.id, label: drv.label, low: vLo, high: vHi,
        lowPct: base ? (vLo - base) / base * 100 : 0,
        highPct: base ? (vHi - base) / base * 100 : 0
      };
    });
    rows.sort((a, b) => Math.max(Math.abs(b.lowPct), Math.abs(b.highPct)) - Math.max(Math.abs(a.lowPct), Math.abs(a.highPct)));
    return { base, rows };
  }

  // 2D-Matrix: Preisänderung × Volumenänderung (User & Standorte)
  function sensitivityGrid(modelId, state, steps) {
    steps = steps || [-20, -10, 0, 10, 20];
    return steps.map(vol => steps.map(pr => {
      const s = clone(state);
      applyFactor(s, modelId, 1 + pr / 100);
      s.markets.forEach(m => {
        const f = 1 + vol / 100;
        ['sites', 'workshops', 'activeUsers', 'occasionalUsers', 'serviceStaff', 'salesStaff', 'marketRevenue'].forEach(k => { m[k] *= f; });
      });
      return forecast(modelId, s).cumulative.slice(-1)[0];
    }));
  }

  // ---------------------------------------------------------------------------
  // Management: Szenarien, Ranking & Empfehlung
  // ---------------------------------------------------------------------------
  function scenarioSummary(state, modelIds) {
    const ids = modelIds || MODELS.map(m => m.id);
    return ids.map(id => {
      const res = {};
      ['worst', 'realistic', 'best'].forEach(k => { res[k] = forecast(id, state, state.scenarios[k]); });
      return { model: MODEL_BY_ID[id], ...res };
    });
  }

  function cvAcross(values) {
    const v = values.filter(x => x > 0);
    if (v.length < 2) return 0;
    const mean = v.reduce((s, x) => s + x, 0) / v.length;
    const sd = Math.sqrt(v.reduce((s, x) => s + (x - mean) ** 2, 0) / v.length);
    return mean ? sd / mean : 0;
  }

  function ranking(state, modelIds) {
    const summary = scenarioSummary(state, modelIds);
    const H = n(state.forecast.horizon) || 5;
    const rows = summary.map(s => {
      const r = s.realistic;
      const revenue = r.cumulative[H - 1];
      const profit = r.cumProfit[H - 1];
      const worstRev = s.worst.cumulative[H - 1];
      const bestRev = s.best.cumulative[H - 1];
      const ss = steadyState(s.model.id, state);
      const fairness = 1 - Math.min(1, cvAcross(ss.perMarket.map(x => x.perUser)));
      return {
        model: s.model, revenue, profit, worstRev, bestRev,
        robustness: bestRev > 0 ? worstRev / bestRev : 0,
        breakEven: r.breakEven,
        margin: revenue > 0 ? profit / revenue : 0,
        fairness,
        annualFirstFull: ss.annual,
        forecast: r
      };
    });
    const maxRev = Math.max(...rows.map(r => r.revenue), 1);
    const start = n(state.forecast.startYear);
    rows.forEach(r => {
      const be = r.breakEven === null ? 0 : 1 - (r.breakEven - start) / H;
      r.scores = {
        revenue: r.revenue / maxRev,
        robustness: r.robustness,
        breakEven: Math.max(0, be),
        fairness: r.fairness,
        simplicity: r.model.simplicity / 5
      };
      r.score = 100 * (0.35 * r.scores.revenue + 0.2 * r.scores.robustness + 0.15 * r.scores.breakEven
        + 0.15 * r.scores.fairness + 0.15 * r.scores.simplicity);
    });
    rows.sort((a, b) => b.score - a.score);
    return rows;
  }

  const api = {
    MODELS, MODEL_BY_ID, MARKET_FIELDS, SENS_DRIVERS, REALISTIC,
    defaultState, clone, getPath, setPath, totalUsers,
    priceKeys, calcModel, licenseUnits, tierOf,
    marketInYear, priceFactor, forecast, steadyState,
    referenceRevenue, solveSingle, optimize, applyFactor,
    monteCarlo, histogram, quantile,
    sensitivity, sensitivityGrid, scenarioSummary, ranking
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.WCP = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* WCP License Calculator – UI, Charts, Export */
(function () {
  'use strict';
  const W = window.WCP;
  const STORE_KEY = 'wcp-license-calculator-v1';
  const charts = {};
  let state = load();
  let current = 'markets';
  let mcResult = null;

  // ---------------------------------------------------------------------------
  // Persistenz
  // ---------------------------------------------------------------------------
  function merge(base, saved) {
    if (Array.isArray(base) || Array.isArray(saved)) return saved !== undefined ? saved : base;
    if (base && typeof base === 'object') {
      const out = { ...base };
      if (saved && typeof saved === 'object') {
        Object.keys(saved).forEach(k => { out[k] = k in base ? merge(base[k], saved[k]) : saved[k]; });
      }
      return out;
    }
    return saved !== undefined ? saved : base;
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return merge(W.defaultState(), JSON.parse(raw));
    } catch (e) { /* ignore */ }
    return W.defaultState();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  // ---------------------------------------------------------------------------
  // Formatierung
  // ---------------------------------------------------------------------------
  const nf0 = new Intl.NumberFormat('de-AT', { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat('de-AT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat('de-AT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nf4 = new Intl.NumberFormat('de-AT', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  const num = v => nf0.format(Math.round(v || 0));
  const eur = v => nf0.format(Math.round(v || 0)) + ' €';
  const eur2 = v => nf2.format(v || 0) + ' €';
  function eurC(v) {
    v = v || 0;
    const a = Math.abs(v);
    if (a >= 1e9) return nf2.format(v / 1e9) + ' Mrd €';
    if (a >= 1e6) return nf2.format(v / 1e6) + ' Mio €';
    if (a >= 1e4) return nf0.format(v / 1e3) + ' T€';
    return eur(v);
  }
  const pct = (v, d = 1) => (d === 0 ? nf0 : d === 2 ? nf2 : nf1).format(v || 0) + ' %';
  function fmtPrice(v, unit) {
    if (v === null || v === undefined || !Number.isFinite(v)) return '–';
    const s = Math.abs(v) < 1 ? nf4.format(v) : Math.abs(v) < 1000 ? nf2.format(v) : nf0.format(Math.round(v));
    return unit === '%' ? s + ' %' : s + ' €';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ---------------------------------------------------------------------------
  // Farben (validierte kategoriale Palette, feste Reihenfolge)
  // ---------------------------------------------------------------------------
  const SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
  const OTHER = '#a9a79f';
  const GRID = '#e1e0d9';
  const AXIS = '#c3c2b7';
  const SURFACE = '#fcfcfb';
  const RAMP = ['#cde2fb', '#b7d3f6', '#9ec5f4', '#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#2a78d6', '#256abf', '#1c5cab', '#184f95', '#104281', '#0d366b'];
  const SCEN_COLORS = { worst: SERIES[1], realistic: SERIES[0], best: SERIES[2] };
  const marketColor = i => (i < SERIES.length ? SERIES[i] : OTHER);
  function rampColor(t) {
    const i = Math.max(0, Math.min(RAMP.length - 1, Math.round(t * (RAMP.length - 1))));
    return { bg: RAMP[i], fg: i >= 7 ? '#ffffff' : '#0b0b0b' };
  }
  function alpha(hex, a) {
    const v = parseInt(hex.slice(1), 16);
    return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
  }

  // ---------------------------------------------------------------------------
  // Chart-Helfer
  // ---------------------------------------------------------------------------
  if (window.Chart) {
    Chart.defaults.font.family = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    Chart.defaults.font.size = 12;
    Chart.defaults.color = '#52514e';
    Chart.defaults.animation.duration = 300;
    Chart.defaults.plugins.tooltip.backgroundColor = '#0e1418';
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.plugins.tooltip.cornerRadius = 6;
    Chart.defaults.plugins.tooltip.boxPadding = 4;
  }

  function makeChart(id, config) {
    if (charts[id]) { charts[id].destroy(); delete charts[id]; }
    const el = document.getElementById(id);
    if (!el || !window.Chart) return null;
    charts[id] = new Chart(el, config);
    return charts[id];
  }

  function opts({ stacked = false, horizontal = false, money = true, legend = true, mode = 'index', fmt } = {}) {
    const f = fmt || (money ? eurC : num);
    const valueAxis = {
      beginAtZero: true, stacked,
      grid: { color: GRID }, border: { display: false },
      ticks: { callback: v => f(v), maxRotation: 0, autoSkipPadding: 12 }
    };
    const catAxis = { stacked, grid: { display: false }, border: { color: AXIS } };
    return {
      responsive: true, maintainAspectRatio: false,
      indexAxis: horizontal ? 'y' : 'x',
      interaction: { mode, intersect: false, axis: horizontal ? 'y' : 'x' },
      plugins: {
        legend: { display: legend, position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded' } },
        tooltip: {
          callbacks: {
            label: c => `${c.dataset.label ? c.dataset.label + ': ' : ''}${f(horizontal ? c.parsed.x : c.parsed.y)}`
          }
        }
      },
      scales: horizontal ? { x: valueAxis, y: catAxis } : { x: catAxis, y: valueAxis }
    };
  }
  const barDs = (label, data, color, extra) => Object.assign({
    label, data, backgroundColor: color, borderRadius: 4, borderSkipped: 'start',
    maxBarThickness: 46, categoryPercentage: 0.75, barPercentage: 0.9
  }, extra || {});
  const stackDs = (label, data, color) => ({
    label, data, backgroundColor: color, borderColor: SURFACE, borderWidth: { top: 2 }, borderSkipped: 'start', maxBarThickness: 56
  });
  const lineDs = (label, data, color, extra) => Object.assign({
    label, data, borderColor: color, backgroundColor: color, borderWidth: 2,
    pointRadius: 4, pointHoverRadius: 6, pointBorderColor: SURFACE, pointBorderWidth: 2, tension: 0
  }, extra || {});

  // ---------------------------------------------------------------------------
  // Formular-Helfer
  // ---------------------------------------------------------------------------
  function inp(path, o = {}) {
    const v = W.getPath(state, path);
    const type = o.type || 'number';
    const attrs = [
      `type="${type}"`, `data-bind="${path}"`,
      `value="${type === 'number' ? (v ?? '') : esc(v)}"`,
      type === 'number' ? `step="${o.step || 'any'}"` : '',
      o.min !== undefined ? `min="${o.min}"` : '',
      o.max !== undefined ? `max="${o.max}"` : ''
    ].join(' ');
    return `<input ${attrs}>`;
  }
  function field(label, path, unit, o) {
    return `<label class="field">${label}<div class="input-unit">${inp(path, o)}${unit ? `<span>${unit}</span>` : ''}</div></label>`;
  }
  function chk(label, path) {
    return `<label class="check"><input type="checkbox" data-bind="${path}" ${W.getPath(state, path) ? 'checked' : ''}>${label}</label>`;
  }
  function select(path, options, isNum) {
    const v = W.getPath(state, path);
    return `<select data-bind="${path}" ${isNum ? 'data-num="1"' : ''}>${options.map(([val, lab]) =>
      `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
  }
  function kpi(label, value, hint, accent, text) {
    return `<div class="kpi ${accent ? 'accent' : ''}"><div class="label">${label}</div><div class="value ${text ? 'text' : ''}" title="${esc(value)}">${value}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
  }
  function pageHead(title, sub, tools) {
    return `<div class="page-head"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${tools ? `<div class="toolbar">${tools}</div>` : ''}</div>`;
  }
  const modelName = id => (W.MODEL_BY_ID[id] || { name: id }).name;
  function enabledModels() {
    const on = new Set(state.ui.enabledModels);
    const list = W.MODELS.filter(m => on.has(m.id));
    return list.length ? list : W.MODELS;
  }
  function modelOptions(list) { return (list || W.MODELS).map(m => [m.id, m.name]); }
  function horizon() { return state.forecast.horizon || 5; }
  function lastYear() { return state.forecast.startYear + horizon() - 1; }
  function scenarioOptions() { return ['worst', 'realistic', 'best'].map(k => [k, state.scenarios[k].name]); }

  // ---------------------------------------------------------------------------
  // Seite 1 – Märkte
  // ---------------------------------------------------------------------------
  function renderMarkets() {
    const ms = state.markets;
    const sum = k => ms.reduce((s, m) => s + (+m[k] || 0), 0);
    const users = sum('activeUsers') + sum('occasionalUsers');
    const metric = state.ui.marketMetric || 'activeUsers';
    const numericFields = W.MARKET_FIELDS.filter(f => f.type !== 'text');
    const warnings = ms.filter(m => W.totalUsers(m) > m.employees).map(m => esc(m.name));

    const rows = ms.map((m, i) => `<tr>
      <td><span class="swatch" style="background:${marketColor(i)}"></span></td>
      ${W.MARKET_FIELDS.map(f => `<td>${inp(`markets.${i}.${f.key}`, { type: f.type === 'text' ? 'text' : 'number', step: f.step || 1, min: 0 })}</td>`).join('')}
      <td><button class="btn small ghost danger" data-action="remove-market" data-i="${i}" title="Markt entfernen">✕</button></td>
    </tr>`).join('');
    const totals = `<tr class="total"><td></td><td>Gesamt (${ms.length})</td>${numericFields.map(f => {
      if (f.key === 'growth') {
        const w = users ? ms.reduce((s, m) => s + m.growth * W.totalUsers(m), 0) / users : 0;
        return `<td class="num">Ø ${nf1.format(w)}</td>`;
      }
      if (f.key === 'rolloutYear') return `<td class="num">${ms.length ? Math.min(...ms.map(m => m.rolloutYear)) + '–' + Math.max(...ms.map(m => m.rolloutYear)) : ''}</td>`;
      return `<td class="num">${num(sum(f.key))}</td>`;
    }).join('')}<td></td></tr>`;

    document.getElementById('page-markets').innerHTML = `
      ${pageHead('Märkte', 'Stammdaten pro Markt pflegen. Alle Berechnungen, Forecasts und Szenarien bauen auf diesen Werten auf.',
        `<button class="btn" data-action="defaults-markets">Beispielmärkte laden</button><button class="btn primary" data-action="add-market">+ Markt hinzufügen</button>`)}
      <div class="kpis">
        ${kpi('Märkte', num(ms.length), 'im Business Case', true)}
        ${kpi('Standorte', num(sum('sites')), num(sum('workshops')) + ' Werkstätten')}
        ${kpi('Mitarbeiter', num(sum('employees')), num(sum('serviceStaff')) + ' Service · ' + num(sum('salesStaff')) + ' Verkauf')}
        ${kpi('User gesamt', num(users), num(sum('activeUsers')) + ' aktiv · ' + num(sum('occasionalUsers')) + ' gelegentlich')}
        ${kpi('Marktumsatz', eurC(sum('marketRevenue') * 1e6), 'Basis für umsatzbasiertes Modell')}
      </div>
      ${warnings.length ? `<div class="callout">Plausibilität: In ${warnings.join(', ')} übersteigt die Anzahl der User die Mitarbeiterzahl.</div>` : ''}
      <div class="card flush">
        <div class="card-head"><h3>Stammdaten</h3><span class="sub">Änderungen werden sofort übernommen</span></div>
        <div class="table-wrap" style="padding:8px 10px 12px">
          <table class="edit">
            <thead><tr><th></th>${W.MARKET_FIELDS.map(f => `<th class="${f.type === 'text' ? '' : 'num'}">${f.label}</th>`).join('')}<th></th></tr></thead>
            <tbody>${rows}${totals}</tbody>
          </table>
        </div>
      </div>
      <div class="grid grid-2 mt">
        <div class="card">
          <div class="card-head"><h3>Marktvergleich</h3>${select('ui.marketMetric', numericFields.filter(f => f.key !== 'rolloutYear').map(f => [f.key, f.label]))}</div>
          <div class="chart-box"><canvas id="chMarketCompare"></canvas></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>User-Struktur je Markt</h3><span class="sub">aktive vs. gelegentliche User</span></div>
          <div class="chart-box"><canvas id="chUserStruct"></canvas></div>
        </div>
      </div>`;

    const labels = ms.map(m => m.name);
    const isMoney = metric === 'marketRevenue';
    const isPct = metric === 'growth';
    makeChart('chMarketCompare', {
      type: 'bar',
      data: { labels, datasets: [barDs(W.MARKET_FIELDS.find(f => f.key === metric).label, ms.map(m => isMoney ? m[metric] * 1e6 : m[metric]), ms.map((_, i) => marketColor(i)))] },
      options: opts({ legend: false, fmt: isMoney ? eurC : isPct ? (v => pct(v)) : num })
    });
    makeChart('chUserStruct', {
      type: 'bar',
      data: {
        labels, datasets: [
          stackDs('Aktive User', ms.map(m => m.activeUsers), SERIES[0]),
          stackDs('Gelegentliche User', ms.map(m => m.occasionalUsers), RAMP[3])
        ]
      },
      options: opts({ stacked: true, money: false })
    });
  }

  // ---------------------------------------------------------------------------
  // Seite 2 – Lizenzmodelle
  // ---------------------------------------------------------------------------
  function renderModels() {
    const sel = state.ui.selectedModel;
    const on = new Set(state.ui.enabledModels);
    const all = W.MODELS.map(m => ({ model: m, ss: W.steadyState(m.id, state) }));
    const enabled = all.filter(x => on.has(x.model.id));
    const cur = all.find(x => x.model.id === sel) || all[0];
    const ss = cur.ss;
    const heatNorm = state.ui.heatNorm || 'global';

    const cards = all.map(({ model, ss: s }) => `
      <div class="model-card ${model.id === sel ? 'sel' : ''} ${on.has(model.id) ? '' : 'off'}" data-action="select-model" data-id="${model.id}">
        <div class="mc-head"><h3>${model.name}</h3><span class="badge ${model.group === 'Erweitert' ? 'accent' : ''}">${model.group}</span></div>
        <div class="mc-desc">${model.desc}</div>
        <div><div class="mc-value">${eurC(s.annual)}</div><div class="note" style="margin:0">Jahresumsatz (Vollausbau)</div></div>
        <div class="mc-stats">
          <div>Monat<b>${eurC(s.monthly)}</b></div>
          <div>/ Standort<b>${eurC(s.perSite)}</b></div>
          <div>/ User<b>${eur2(s.perUser)}</b></div>
        </div>
      </div>`).join('');

    const partLabels = [];
    ss.perMarket.forEach(pm => pm.parts.forEach(([l]) => { if (!partLabels.includes(l)) partLabels.push(l); }));
    const detailRows = ss.perMarket.map((pm, i) => `<tr>
      <td><span class="swatch" style="background:${marketColor(i)}"></span>${esc(pm.name)}</td>
      <td class="num">${eur(pm.annual)}</td><td class="num">${eur(pm.monthly)}</td>
      <td class="num">${eur(pm.perSite)}</td><td class="num">${eur2(pm.perUser)}</td>
      <td class="num">${num(pm.units.value)}</td>
      <td class="num">${pct(ss.annual ? pm.annual / ss.annual * 100 : 0)}</td></tr>`).join('');

    // Heatmap Markt × Modell
    const hmVals = state.markets.map((m, i) => enabled.map(x => x.ss.perMarket[i].annual));
    const gMax = Math.max(1, ...hmVals.flat());
    const colMax = enabled.map((_, j) => Math.max(1, ...hmVals.map(r => r[j])));
    const hmRows = state.markets.map((m, i) => `<tr><td><span class="swatch" style="background:${marketColor(i)}"></span>${esc(m.name)}</td>${
      hmVals[i].map((v, j) => {
        const c = rampColor(v / (heatNorm === 'global' ? gMax : colMax[j]));
        return `<td class="hm" style="background:${c.bg};color:${c.fg}" title="${esc(m.name)} · ${enabled[j].model.name}: ${eur(v)}">${eurC(v)}</td>`;
      }).join('')}</tr>`).join('');

    document.getElementById('page-models').innerHTML = `

          <tbody>${detailRows}<tr class="total"><td>Gesamt</td><td class="num">${eur(ss.annual)}</td><td class="num">${eur(ss.monthly)}</td><td class="num">${eur(ss.perSite)}</td><td class="num">${eur2(ss.perUser)}</td><td class="num">${num(ss.perMarket.reduce((s, x) => s + x.units.value, 0))}</td><td class="num">100 %</td></tr></tbody>

      </div>
      <div class="card mt">

        <div class="chart-box"><canvas id="chParts"></canvas></div>
      </div>
      <div class="card mt flush">
        <div class="card-head"><h3>Heatmap Markt × Modell</h3>
          <div class="seg"><button class="${heatNorm === 'global' ? 'on' : ''}" data-action="heatnorm" data-v="global">Global skaliert</button><button class="${heatNorm === 'column' ? 'on' : ''}" data-action="heatnorm" data-v="column">Je Modell skaliert</button></div></div>
        <div class="table-wrap" style="padding:8px 10px 12px"><table class="heatmap">
          <thead><tr><th>Markt</th>${enabled.map(x => `<th class="num">${x.model.name}</th>`).join('')}</tr></thead>
          <tbody>${hmRows}<tr class="total"><td>Gesamt</td>${enabled.map(x => `<td class="num">${eurC(x.ss.annual)}</td>`).join('')}</tr></tbody>

        <div class="legend-scale">niedrig <span class="bar"></span> hoch · Jahresumsatz Vollausbau</div></div>
      </div>`;

    const sorted = enabled.slice().sort((a, b) => b.ss.annual - a.ss.annual);
    makeChart('chModels', {
      type: 'bar',
      data: { labels: sorted.map(x => x.model.name), datasets: [barDs('Jahresumsatz', sorted.map(x => x.ss.annual), sorted.map(x => x.model.id === sel ? SERIES[0] : RAMP[2]))] },
      options: Object.assign(opts({ horizontal: true, legend: false }), {

      })

    makeChart('chModelShare', {
      type: 'doughnut',
      data: { labels: ss.perMarket.map(p => p.name), datasets: [{ data: ss.perMarket.map(p => p.annual), backgroundColor: ss.perMarket.map((_, i) => marketColor(i)), borderColor: SURFACE, borderWidth: 2 }] },
      options: {

          legend: { position: 'right', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded' } },

      }

    const partsShown = partLabels.slice(0, 7);
    const partsOther = partLabels.slice(7);
    const partDatasets = partsShown.map((l, k) => stackDs(l, ss.perMarket.map(pm => (pm.parts.find(p => p[0] === l) || [0, 0])[1]), SERIES[k]));

      partDatasets.push(stackDs('Sonstige', ss.perMarket.map(pm => pm.parts.filter(p => partsOther.includes(p[0])).reduce((s, p) => s + p[1], 0)), OTHER));

    workshop: [['workshop.pricePerWorkshop', 'Preis pro Werkstatt', '€ / Monat']],
    enterprise: [['enterprise.flatFee', 'Flat Fee pro Markt', '€ / Jahr']],
    revenue: [['revenue.percent', 'Anteil vom Marktumsatz', '%']],

      ['hybrid.useUser', 'Userpreis', [['hybrid.userPrice', 'Userpreis (nicht-concurrent)', '€ / Monat']]],

    ],
    consumption: [
      ['consumption.useLogins', 'Logins', [['consumption.loginsPerUser', 'Logins / User', 'pro Monat'], ['consumption.priceLogin', 'Preis / Login', '€']]],
      ['consumption.useSessions', 'Sessions', [['consumption.sessionsPerUser', 'Sessions / User', 'pro Monat'], ['consumption.priceSession', 'Preis / Session', '€']]],
      ['consumption.useApi', 'API Calls', [['consumption.apiPerSite', 'API Calls / Standort', 'pro Monat'], ['consumption.priceApi1000', 'Preis / 1.000 Calls', '€']]],

  function catalogCard(model, body) {
    const ss = W.steadyState(model.id, state);
    return `<div class="card catalog-card" id="cat-${model.id}">
      <div class="card-head"><h3>${model.name}</h3><span class="badge ${model.group === 'Erweitert' ? 'accent' : ''}">${model.group}</span></div>
      <p class="note" style="margin:0 0 12px">${model.desc}</p>
      ${body}
      <div class="result"><span>Jahresumsatz Vollausbau</span><b>${eur(ss.annual)}</b></div>
      <div class="result" style="border:0;margin-top:2px;padding-top:0"><span>pro User / Monat</span><b>${eur2(ss.perUser / 12)}</b></div>
    </div>`;
  }

  function itemTable(modelId, withUnits) {
    const items = state.prices[modelId].items;
    return `<div class="table-wrap"><table class="edit"><thead><tr><th></th><th>Modul</th><th>Basis</th>${withUnits ? '<th class="num">Einheiten / Standort</th>' : ''}<th class="num">Preis €</th><th class="num">Adoption %</th></tr></thead><tbody>
      ${items.map((it, i) => `<tr>
        <td><input type="checkbox" data-bind="prices.${modelId}.items.${i}.enabled" ${it.enabled ? 'checked' : ''}></td>
        <td>${esc(it.name)}</td>
        <td>${select(`prices.${modelId}.items.${i}.basis`, [['user', 'aktiver User'], ['site', 'Standort']].concat(withUnits ? [['unit', 'Einheit']] : []))}</td>
        ${withUnits ? `<td>${it.basis === 'unit' ? inp(`prices.${modelId}.items.${i}.units`, { min: 0 }) : '<span class="note">–</span>'}</td>` : ''}
        <td>${inp(`prices.${modelId}.items.${i}.price`, { min: 0 })}</td>
        <td>${inp(`prices.${modelId}.items.${i}.adoption`, { min: 0, max: 100 })}</td>
      </tr>`).join('')}</tbody></table></div>
      <p class="note">Preise pro Monat je ${withUnits ? 'aktivem User, Standort bzw. Einheit (z. B. Automatisierungslauf, Dokument)' : 'aktivem User bzw. Standort'}; Adoption = Anteil der Basis, der das Modul nutzt.</p>`;
  }

  function renderCatalog() {
    const cards = W.MODELS.map(model => {
      let body = '';
      if (SIMPLE_CATALOG[model.id]) {
        body = `<div class="field-row">${SIMPLE_CATALOG[model.id].map(([p, l, u]) => field(l, 'prices.' + p, u, { min: 0 })).join('')}</div>`;
      } else if (GROUP_CATALOG[model.id]) {
        body = GROUP_CATALOG[model.id].map(([flag, label, fields]) => `
          <div class="subgroup" style="grid-template-columns:150px repeat(${fields.length}, minmax(0,1fr))">
            ${chk(label, 'prices.' + flag)}
            ${fields.map(([p, l, u]) => field(l, 'prices.' + p, u, { min: 0 })).join('')}
          </div>`).join('');
      } else if (model.id === 'tier') {
        const tiers = state.markets.map(m => `${esc(m.name)}: <b>${({ small: 'Small', medium: 'Medium', enterprise: 'Enterprise' })[W.tierOf(W.totalUsers(m), state.prices.tier)]}</b>`).join(' · ');
        body = `<div class="field-row">
            ${field('Small bis', 'prices.tier.smallMax', 'User', { min: 0, step: 1 })}
            ${field('Medium bis', 'prices.tier.mediumMax', 'User', { min: 0, step: 1 })}
          </div>
          <div class="table-wrap mt"><table class="edit"><thead><tr><th>Tier</th><th class="num">Grundgebühr € / Jahr</th><th class="num">Preis € / User / Monat</th></tr></thead><tbody>
            <tr><td>Small</td><td>${inp('prices.tier.smallBase', { min: 0 })}</td><td>${inp('prices.tier.smallUser', { min: 0 })}</td></tr>
            <tr><td>Medium</td><td>${inp('prices.tier.mediumBase', { min: 0 })}</td><td>${inp('prices.tier.mediumUser', { min: 0 })}</td></tr>
            <tr><td>Enterprise</td><td>${inp('prices.tier.entBase', { min: 0 })}</td><td>${inp('prices.tier.entUser', { min: 0 })}</td></tr>
          </tbody></table></div>
          <p class="note">Einstufung nach User gesamt je Markt – ${tiers}</p>`;
      } else if (model.id === 'modules') {
        body = itemTable('modules', false);
      } else if (model.id === 'ai') {
        body = itemTable('ai', true);
      }
      return catalogCard(model, body);
    }).join('');

    const c = state.costs;
    document.getElementById('page-catalog').innerHTML = `
      ${pageHead('Preiskatalog', 'Preise und Parameter je Lizenzmodell. Alle Monatspreise werden ×12 auf den Jahresumsatz hochgerechnet. Die Kostenbasis wird für Break-Even und Profitabilität verwendet.',
        `<select id="catJump">${modelOptions().map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>`)}
      <div class="card">
        <div class="card-head"><h3>Kostenbasis (Break-Even)</h3><span class="sub">Annahmen für Plattform, Rollout und Betrieb</span></div>
        <div class="field-row">
          ${field('Plattform einmalig', 'costs.platformOneTime', '€', { min: 0 })}
          ${field('Rollout pro Markt (einmalig)', 'costs.rolloutPerMarket', '€', { min: 0 })}
          ${field('Betrieb pro User', 'costs.runPerUserYear', '€ / Jahr', { min: 0 })}
          ${field('Betrieb pro Markt', 'costs.runPerMarketYear', '€ / Jahr', { min: 0 })}
        </div>
        <p class="note">Plattformkosten fallen im Startjahr ${state.forecast.startYear} an, Rolloutkosten im jeweiligen Rollout-Jahr des Markts.</p>
      </div>
      <div class="catalog-grid mt">${cards}</div>`;

    const jump = document.getElementById('catJump');
    jump.addEventListener('change', () => {
      const el = document.getElementById('cat-' + jump.value);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  // ---------------------------------------------------------------------------
  // Seite 4 – Forecast
  // ---------------------------------------------------------------------------
  function renderForecast() {
    const fc = state.forecast;
    const sel = state.ui.selectedModel;
    const scKey = state.ui.forecastScenario || 'realistic';
    const f = W.forecast(sel, state, state.scenarios[scKey]);
    const H = f.years.length;
    const firstFull = f.total.find(v => v > 0) || 0;
    const firstIdx = f.total.findIndex(v => v > 0);
    const cagr = H > 1 && firstFull > 0 && firstIdx < H - 1 ? (Math.pow(f.total[H - 1] / firstFull, 1 / (H - 1 - firstIdx)) - 1) * 100 : null;
    const models = enabledModels();
    const allF = models.map(m => ({ model: m, f: W.forecast(m.id, state, state.scenarios[scKey]) }));

    const mRows = state.markets.map((m, i) => `<tr><td><span class="swatch" style="background:${marketColor(i)}"></span>${esc(m.name)}</td><td class="num">${m.rolloutYear}</td>${f.byMarket[i].map(v => `<td class="num">${v ? eur(v) : '<span class="note">–</span>'}</td>`).join('')}<td class="num"><b>${eur(f.byMarket[i].reduce((s, v) => s + v, 0))}</b></td></tr>`).join('');
    const modelRows = allF.map(({ model, f: g }) => `<tr class="${model.id === sel ? 'sel' : ''}" style="cursor:pointer" data-action="select-model" data-id="${model.id}"><td>${model.name}</td>${g.total.map(v => `<td class="num">${eurC(v)}</td>`).join('')}<td class="num"><b>${eurC(g.cumulative[H - 1])}</b></td><td class="num">${g.breakEven || `<span class="badge bad">&gt; ${lastYear()}</span>`}</td></tr>`).join('');

    document.getElementById('page-forecast').innerHTML = `
      ${pageHead('Forecast', 'Hochrechnung über 1, 3 oder 5 Jahre unter Berücksichtigung von Marktwachstum, neuen Standorten, neuen Usern, Preissteigerungen und Rollout-Jahren.',
        `<div class="seg">${[1, 3, 5].map(h => `<button class="${fc.horizon === h ? 'on' : ''}" data-action="horizon" data-h="${h}">${h} ${h === 1 ? 'Jahr' : 'Jahre'}</button>`).join('')}</div>`)}
      <div class="card">
        <div class="card-head"><h3>Forecast-Parameter</h3><span class="sub">gelten für alle Modelle</span></div>
        <div class="field-row">
          <label class="field">Lizenzmodell${select('ui.selectedModel', modelOptions())}</label>
          <label class="field">Szenario${select('ui.forecastScenario', scenarioOptions())}</label>
          ${field('Startjahr', 'forecast.startYear', '', { step: 1 })}
          ${field('Preissteigerung', 'forecast.priceIncrease', '% p.a.', { step: 0.1 })}
          ${field('Neue Standorte', 'forecast.newSites', '% p.a.', { step: 0.1 })}
          ${field('Neue User (zusätzl. zum Wachstum)', 'forecast.newUsers', '% p.a.', { step: 0.1 })}
          ${field('Adoption im Rollout-Jahr', 'forecast.firstYearAdoption', '%', { min: 0, max: 100 })}
        </div>
        <p class="note">User und Mitarbeiter wachsen mit der Marktwachstumsrate (Stammdaten) plus „Neue User“; Standorte/Werkstätten mit „Neue Standorte“. Im Rollout-Jahr wird nur die eingestellte Adoption realisiert. Preissteigerung gilt nicht für das umsatzbasierte Modell (wächst mit dem Marktumsatz).</p>
      </div>
      <div class="kpis mt">
        ${kpi(`Umsatz ${f.years[0]}`, eurC(f.total[0]), modelName(sel), true)}
        ${kpi(`Umsatz ${f.years[H - 1]}`, eurC(f.total[H - 1]), eurC(f.total[H - 1] / 12) + ' / Monat')}
        ${kpi(`Kumuliert ${H} ${H === 1 ? 'Jahr' : 'Jahre'}`, eurC(f.cumulative[H - 1]), state.scenarios[scKey].name)}
        ${kpi('CAGR', cagr === null ? '–' : pct(cagr), 'ab erstem Umsatzjahr')}
        ${kpi('Break-Even', f.breakEven ? String(f.breakEven) : `> ${lastYear()}`, 'kumulierter Gewinn ≥ 0')}
      </div>
      <div class="grid grid-2">
        <div class="card"><div class="card-head"><h3>Forecast-Entwicklung je Markt</h3><span class="sub">${modelName(sel)}</span></div><div class="chart-box tall"><canvas id="chFc"></canvas></div></div>
        <div class="card"><div class="card-head"><h3>Umsatz vs. Kosten</h3><span class="sub">jährlich</span></div><div class="chart-box tall"><canvas id="chFcCost"></canvas></div></div>
      </div>
      <div class="card mt flush">
        <div class="card-head"><h3>Umsatz je Markt und Jahr</h3><span class="sub">${modelName(sel)} · ${state.scenarios[scKey].name}</span></div>
        <div class="table-wrap" style="padding:8px 10px 12px"><table>
          <thead><tr><th>Markt</th><th class="num">Rollout</th>${f.years.map(y => `<th class="num">${y}</th>`).join('')}<th class="num">Summe</th></tr></thead>
          <tbody>${mRows}
            <tr class="total"><td>Gesamt</td><td></td>${f.total.map(v => `<td class="num">${eur(v)}</td>`).join('')}<td class="num">${eur(f.cumulative[H - 1])}</td></tr>
            <tr><td>Kosten</td><td></td>${f.cost.map(v => `<td class="num">${eur(v)}</td>`).join('')}<td class="num">${eur(f.cost.reduce((s, v) => s + v, 0))}</td></tr>
            <tr><td>Ergebnis kumuliert</td><td></td>${f.cumProfit.map(v => `<td class="num ${v < 0 ? 'delta-down' : 'delta-up'}">${eur(v)}</td>`).join('')}<td></td></tr>
          </tbody></table></div>
      </div>
      <div class="card mt flush">
        <div class="card-head"><h3>Alle Modelle im Forecast</h3><span class="sub">Zeile anklicken, um Modell auszuwählen</span></div>
        <div class="table-wrap" style="padding:8px 10px 12px"><table>
          <thead><tr><th>Modell</th>${f.years.map(y => `<th class="num">${y}</th>`).join('')}<th class="num">Kumuliert</th><th class="num">Break-Even</th></tr></thead>
          <tbody>${modelRows}</tbody></table></div>
      </div>`;

    makeChart('chFc', {
      type: 'bar',
      data: { labels: f.years, datasets: state.markets.map((m, i) => stackDs(m.name, f.byMarket[i], marketColor(i))) },
      options: opts({ stacked: true })
    });
    makeChart('chFcCost', {
      type: 'line',
      data: { labels: f.years, datasets: [lineDs('Umsatz', f.total, SERIES[0]), lineDs('Kosten', f.cost, SERIES[1])] },
      options: opts()
    });
  }

  // ---------------------------------------------------------------------------
  // Seite 5 – Szenarien
  // ---------------------------------------------------------------------------
  function renderScenarios() {
    const sel = state.ui.selectedModel;
    const models = enabledModels();
    const summary = W.scenarioSummary(state, models.map(m => m.id));
    const H = horizon();
    const selSum = W.scenarioSummary(state, [sel])[0];
    const keys = ['worst', 'realistic', 'best'];

    const scCard = k => {
      const s = state.scenarios[k];
      return `<div class="card">
        <div class="card-head"><h3><span class="swatch" style="background:${SCEN_COLORS[k]}"></span>${s.name}</h3><span class="sub">${modelName(sel)}: ${eurC(selSum[k].cumulative[H - 1])}</span></div>
        <div class="field-row" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">
          ${field('Volumen-Faktor', `scenarios.${k}.volume`, '×', { step: 0.01, min: 0 })}
          ${field('Wachstum Δ', `scenarios.${k}.growthDelta`, 'pp', { step: 0.1 })}
          ${field('Preissteigerung Δ', `scenarios.${k}.priceDelta`, 'pp', { step: 0.1 })}
          ${field('Rollout-Verzögerung', `scenarios.${k}.rolloutDelay`, 'Jahre', { step: 1, min: 0 })}
          ${field('Adoption Δ (Rollout-Jahr)', `scenarios.${k}.adoptionDelta`, 'pp', { step: 1 })}
        </div>
      </div>`;
    };

    const rows = summary.map(s => {
      const w = s.worst.cumulative[H - 1], r = s.realistic.cumulative[H - 1], b = s.best.cumulative[H - 1];
      return `<tr class="${s.model.id === sel ? 'sel' : ''}" style="cursor:pointer" data-action="select-model" data-id="${s.model.id}">
        <td>${s.model.name}</td>
        <td class="num">${eurC(w)}</td><td class="num"><b>${eurC(r)}</b></td><td class="num">${eurC(b)}</td>
        <td class="num">${eurC(b - w)}</td><td class="num">${pct(r ? (b - w) / r * 100 : 0, 0)}</td>
        ${keys.map(k => `<td class="num">${s[k].breakEven || '–'}</td>`).join('')}
      </tr>`;
    }).join('');

    document.getElementById('page-scenarios').innerHTML = `
      ${pageHead('Szenarien', `Best, Realistic und Worst Case nebeneinander – kumulierter Umsatz über ${H} ${H === 1 ? 'Jahr' : 'Jahre'} (${state.forecast.startYear}–${lastYear()}).`,
        `<label class="field" style="min-width:220px">Modell für Detailansicht${select('ui.selectedModel', modelOptions())}</label>`)}
      <div class="grid grid-3">${keys.map(scCard).join('')}</div>
      <div class="grid grid-2 mt">
